# Navigation Links
#   To link a homepage widget, specify the URL as a hash `#` followed by the filename of the
  #     desired widget in your `content/home/` folder.
  #   The weight parameter defines the order that the links will appear in.

main:
  - name: Bio
    url: /
    weight: 10
  - name: Project Portfolio
    url: /#projects
    weight: 20
  - name: Publications
    url: /#publications
    weight: 30
  - name: Presentations
    url: presentations/
    weight: 40
  - name: News
    url: news/
    weight: 60
  - name: Experience
    url: experience/
    weight: 15
  - name: Teaching
    url: teaching/
    weight: 50
